<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Impressum - ALL IN ONE Germany</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: Arial, Helvetica, sans-serif;
}

/* Scrollbar unsichtbar */
body {
    overflow-x: hidden;
    overflow-y: auto;
    scrollbar-width: none; /* Firefox */
}
body::-webkit-scrollbar {
    width: 0px;
    background: transparent; /* Chrome, Edge, Safari */
}

/* Body + Hintergrund */
body {
    min-height: 100vh;
    background: radial-gradient(circle at top, #1a1a1a, #000);
    color: #fff;
}

body::before {
    content: "";
    position: fixed;
    inset: 0;
    background: linear-gradient(120deg, #111, #222, #111);
    filter: blur(60px);
    z-index: -1;
}

/* Header */
header {
    text-align: center;
    padding: 120px 20px 80px;
}
header h1 {
    font-size: 3rem;
    margin-bottom: 20px;
}
header p {
    max-width: 800px;
    margin: auto;
    color: #ccc;
    line-height: 1.6;
}

/* Footer */
footer {
    position: fixed;
    bottom: 15px;
    right: 20px;
}
footer a {
    color: #fff;
    text-decoration: none;
}
footer a:hover {
    text-decoration: underline;
}
</style>
</head>

<body>

<header>
    <h1>Diese Seite wurde von Blue ⚡ erstellt!</h1>
    <p>
        Wir, das Team von Blue, erstellen für unsere Partner kostenlos individuelle Websites. 
        Schnell, unkompliziert und genau nach den Wünschen unserer Partner – von Design bis Inhalt, 
        alles aus einer Hand.<br><br>
        &copy; 2026 Alle Rechte vorbehalten.
    </p>
</header>

<footer>
    <a href="https://website.blue-lol.de" target="_blank">
        Powered by Blue ⚡
    </a>
</footer>

</body>
</html>
