<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Unsere Streamer - ALL IN ONE Germany</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: Arial, Helvetica, sans-serif;
}

/* Scrollbar unsichtbar */
body {
    overflow-x: hidden;
    overflow-y: auto;
    scrollbar-width: none;
}
body::-webkit-scrollbar {
    width: 0;
    background: transparent;
}

/* Hintergrund */
body {
    min-height: 100vh;
    background: radial-gradient(circle at top, #1a1a1a, #000);
    color: #fff;
}

body::before {
    content: "";
    position: fixed;
    inset: 0;
    background: linear-gradient(120deg, #111, #222, #111);
    filter: blur(60px);
    z-index: -1;
}

/* Header */
header {
    text-align: center;
    padding: 80px 20px 50px;
}
header h1 {
    font-size: 3rem;
}

/* Grid */
.grid {
    max-width: 1400px;
    margin: auto;
    padding: 0 20px 100px;
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
    gap: 30px;
}

/* Streamer Card */
.streamer-card {
    background: rgba(30,30,30,0.95);
    border-radius: 18px;
    padding: 25px 15px 30px;
    text-align: center;
    transition: transform 0.25s, box-shadow 0.25s;
}

.streamer-card:hover {
    transform: translateY(-6px);
    box-shadow: 0 12px 25px rgba(255,255,255,0.12);
}

/* Avatar */
.avatar {
    width: 100px;
    height: 100px;
    margin: 0 auto 15px;
    border-radius: 50%;
    background-size: cover;
    background-position: center;
    border: 3px solid #444;
}

/* Name */
.streamer-card h3 {
    margin-bottom: 14px;
    font-size: 1.2rem;
}

/* Social Icons */
.socials {
    display: flex;
    justify-content: center;
    gap: 16px;
}

.socials a {
    width: 38px;
    height: 38px;
    background: rgba(60,60,60,0.9);
    border-radius: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: transform 0.2s, background 0.2s;
}

.socials a:hover {
    transform: scale(1.15);
    background: rgba(90,90,90,1);
}

.socials img {
    width: 22px;
    height: 22px;
}

/* Footer */
footer {
    position: fixed;
    bottom: 15px;
    right: 20px;
}
footer a {
    color: #fff;
    text-decoration: none;
}
footer a:hover {
    text-decoration: underline;
}
</style>
</head>

<body>

<header>
    <h1>UNSERE STREAMER</h1>
</header>

<div class="grid">

    <!-- Streamer 1 (alle Icons) -->
    <div class="streamer-card">
        <div class="avatar" style="background-image: url('bilder/streamer1.jpg');"></div>
        <h3>StreamerName</h3>
        <div class="socials">
            <a href="https://youtube.com" target="_blank">
                <img src="https://i.imgur.com/GoctMY6.png" alt="YouTube">
            </a>
            <a href="https://twitch.tv" target="_blank">
                <img src="https://i.imgur.com/At3eqdR.png" alt="Twitch">
            </a>
            <a href="https://tiktok.com" target="_blank">
                <img src="https://i.imgur.com/TeIFaIh.png" alt="TikTok">
            </a>
        </div>
    </div>

    <!-- Streamer 2 (nur Twitch & TikTok) -->
    <div class="streamer-card">
        <div class="avatar" style="background-image: url('bilder/streamer2.jpg');"></div>
        <h3>StreamerName</h3>
        <div class="socials">
            <a href="https://twitch.tv" target="_blank">
                <img src="https://i.imgur.com/At3eqdR.png" alt="Twitch">
            </a>
            <a href="https://tiktok.com" target="_blank">
                <img src="https://i.imgur.com/TeIFaIh.png" alt="TikTok">
            </a>
        </div>
    </div>

    <!-- Streamer 3 (nur YouTube) -->
    <div class="streamer-card">
        <div class="avatar" style="background-image: url('bilder/streamer3.jpg');"></div>
        <h3>StreamerName</h3>
        <div class="socials">
            <a href="https://youtube.com" target="_blank">
                <img src="https://i.imgur.com/GoctMY6.png" alt="YouTube">
            </a>
        </div>
    </div>

</div>

<footer>
    <a href="https://website.blue-lol.de" target="_blank">
        Powered by Blue ⚡
    </a>
</footer>

</body>
</html>
