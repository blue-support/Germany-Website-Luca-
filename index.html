<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <title>ALL IN ONE Germany</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, Helvetica, sans-serif;
    }

    body {
      height: 100vh;
      background: linear-gradient(270deg, #0d6efd, #ffffff);
      background-size: 400% 400%;
      animation: backgroundMove 8s ease infinite;
      display: flex;
      justify-content: center;
      align-items: center;
      color: #0d1b2a;
    }

    @keyframes backgroundMove {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    .center {
      text-align: center;
    }

    h1 {
      font-size: 3rem;
      margin-bottom: 10px;
    }

    h2 {
      font-size: 1.5rem;
      font-weight: normal;
      margin-bottom: 20px;
    }

    .loader {
      font-size: 2rem;
      letter-spacing: 5px;
      animation: blink 1.5s infinite;
    }

    @keyframes blink {
      0% { opacity: 0.2; }
      50% { opacity: 1; }
      100% { opacity: 0.2; }
    }

    .footer {
      position: absolute;
      bottom: 15px;
      right: 20px;
      font-size: 0.9rem;
    }

    .footer a {
      text-decoration: none;
      color: #0d1b2a;
      font-weight: bold;
    }

    .footer a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>

  <div class="center">
    <h1>ALL IN ONE Germany</h1>
    <h2>Website in Bearbeitung</h2>
    <div class="loader">...</div>
  </div>

  <div class="footer">
    <a href="https://webstite.blue-lol.de" target="_blank">
      Powered by Blue ⚡
    </a>
  </div>

</body>
</html>
